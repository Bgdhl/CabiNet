<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CabiNet — Sign in</title>
<!--
  The hub's sign-in page (optional hub login, web_auth.py). Served at /login
  only while the lock is on. Self-contained: no CDN, the slot VLAN is offline.
  POSTs /api/auth/login {username, password}; the hub answers with the
  session cookie and this page goes to ?next= (same-origin paths only).

  The hub's own touchscreen has no keyboard, so osk.js draws one there
  (the 800x480 DSI, or ?kiosk=1 carried in next=).
-->
<style>
  /* Emoji for a device that has no emoji font of its own (the hub's
     touchscreen, a wall TV): a small subset of Noto Color Emoji that the hub
     serves itself — see G2S/tools/build_emoji_font.py. Last in every font
     stack below, after the device's own emoji fonts, and only fetched when
     a page actually has to draw one from it. */
  @font-face{font-family:"CabiNet Emoji";font-display:swap;
    src:url("/webui/emoji.woff2") format("woff2");
    unicode-range:U+200D,U+20E3,U+FE0F,U+2300-23FF,U+2600-27BF,U+2B00-2BFF,
      U+1F000-1FFFF}
  :root{
    --bg:#150f0b; --bg-hi:#241812; --card:#1e1510; --inset:#0d0906;
    --line:#3b2b1d; --ivory:#f4ead7; --dim:#b69d7c; --faint:#7e6950;
    --gold:#d9a94f; --gold-hi:#f2d492; --ruby:#e0564d;
    --display:Georgia,"Palatino Linotype","Book Antiqua","Times New Roman",serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","CabiNet Emoji";
    --sans:-apple-system,"Segoe UI",Roboto,"DejaVu Sans",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","CabiNet Emoji";
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);
    background-image:radial-gradient(1100px 520px at 50% -160px,var(--bg-hi),transparent 70%);
    color:var(--ivory);font:15px/1.5 var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;touch-action:manipulation}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .box{width:100%;max-width:360px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px}
  .brand{font:700 20px var(--display);letter-spacing:.3em;text-align:center}
  .brand b{color:var(--gold)}
  .sub{font:600 10px var(--sans);letter-spacing:.28em;color:var(--faint);
    text-align:center;margin:2px 0 18px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  input{width:100%;padding:11px 12px;border-radius:8px;font:16px var(--sans);
    background:var(--inset);border:1px solid var(--line);color:var(--ivory)}
  input.on{border-color:var(--gold)}
  button.go{width:100%;margin-top:18px;padding:12px;border-radius:8px;border:0;
    background:var(--gold);color:#1a1108;font:700 15px var(--sans);cursor:pointer}
  button.go:disabled{opacity:.55;cursor:default}
  #msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--ruby);
    text-align:center}
  .foot{margin-top:10px;font-size:11px;color:var(--faint);text-align:center}

  /* ---- hub touchscreen: osk.js draws the keyboard along the bottom, so the
     form goes compact and sits at the top ---------------------------------- */
  html.osk body{justify-content:flex-start;padding:8px}
  html.osk .box{max-width:560px;padding:10px 14px 10px;
    display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  html.osk .brand,html.osk .sub,html.osk .foot{display:none}
  html.osk label{margin:0 0 3px}
  html.osk button.go,html.osk #msg{grid-column:1/3}
  html.osk button.go{margin-top:10px;padding:10px}
  html.osk #msg{margin-top:6px;min-height:18px}
</style>
<script src="/webui/osk.js"></script>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="brand">CABI<b>NET</b></div>
  <div class="sub">SIGN IN</div>
  <div><label for="u">Username</label>
    <input id="u" name="username" data-osk-go="Sign in" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" maxlength="32"></div>
  <div><label for="p">Password</label>
    <input id="p" name="password" type="password" data-osk-go="Sign in"
           autocomplete="current-password" maxlength="128"></div>
  <button class="go" id="go" type="submit">Sign in</button>
  <div id="msg" role="alert"></div>
  <div class="foot">Locked out? On the hub itself, run
    <code>python3 G2S/tools/hub_login.py</code></div>
</form>

<script>
"use strict";
var $=function(id){return document.getElementById(id);};
var QS=new URLSearchParams(location.search);

/* next= must be a plain same-origin path — never a full URL, never "//host". */
function nextPath(){
  var n=QS.get("next")||"/";
  if(n.charAt(0)!=="/"||n.charAt(1)==="/"||n.charAt(1)==="\\"||
     n.indexOf("/login")===0) n="/";
  return n;
}
var NEXT=nextPath();

/* ---- sign in ------------------------------------------------------------- */
var busy=false;
function say(t){$("msg").textContent=t||"";}
async function signIn(){
  if(busy) return;
  var u=$("u").value.trim(), p=$("p").value;
  if(!u||!p){say("Enter your username and password."); return;}
  busy=true; $("go").disabled=true; say("");
  try{
    var r=await fetch("/api/auth/login",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:u,password:p})});
    var j=await r.json().catch(function(){return {};});
    if(j.ok===true){location.replace(NEXT); return;}
    say(String(j.error||("Sign-in failed (HTTP "+r.status+")")));
    $("p").value="";
    $("p").focus();
  }catch(e){
    say("The hub did not answer — try again.");
  }
  busy=false; $("go").disabled=false;
}
$("f").addEventListener("submit",function(e){e.preventDefault(); signIn();});

/* Already signed in (or the lock was turned off)? Skip the form. */
fetch("/api/auth/state",{cache:"no-store"}).then(function(r){return r.json();})
  .then(function(s){if(s&&(s.required===false||s.signedIn)) location.replace(NEXT);})
  .catch(function(){});

$("u").focus();
</script>
</body>
</html>
